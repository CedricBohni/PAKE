name: visualizer

# Publishes web/ plus the Python package to GitHub Pages.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths: ["web/**", "src/fapake/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/fapake
          cp web/index.html web/style.css web/app.js web/worker.js _site/
          cp src/fapake/*.py _site/fapake/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
